# Local development services. `./gradlew bootRun` starts these automatically (spring-boot-docker-compose);
# tests use Testcontainers instead. Keep the Postgres image in sync with TestcontainersConfiguration.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # dev only - never reuse outside this compose file
    ports:
      - "5432"                 # random host port; Spring Boot discovers it
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
