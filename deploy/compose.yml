# Production stack on one VPS (ADR-0006): Caddy (HTTPS) -> app -> Postgres + Garage (S3).
# Only Caddy is reachable from outside. Secrets come from deploy/.env (template: .env.example next to this file).
#
#   cd deploy && docker compose up -d --build        # first start and every deploy
#   docker compose logs -f app                       # logs
# See deploy/README.md for setup, backups and restore.
name: fotozielnik-prod

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # certificates - keep across deploys (Let's Encrypt rate limits)
      - caddy-config:/config

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fotozielnik/app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fotozielnik
      SPRING_DATASOURCE_USERNAME: fotozielnik
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: photos
      S3_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?set GARAGE_ACCESS_KEY_ID in deploy/.env}
      S3_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?set GARAGE_SECRET_ACCESS_KEY in deploy/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in deploy/.env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD in deploy/.env}
      FOTOZIELNIK_JOBS_WORKERS: ${JOB_WORKERS:-0}   # 0 = cores - 1
    # Bounded so a burst of image processing cannot starve Postgres; heap = 60 % of this (Dockerfile).
    mem_limit: ${APP_MEMORY:-6g}
    tmpfs:
      - /tmp:size=2g                 # uploads are spooled here before going to S3

  postgres:
    build: ../docker/postgres
    image: fotozielnik/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: fotozielnik
      POSTGRES_USER: fotozielnik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotozielnik -d fotozielnik"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage:
    build: ../docker/garage
    image: fotozielnik/garage:2.2
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in deploy/.env}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?set GARAGE_ACCESS_KEY_ID in deploy/.env}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?set GARAGE_SECRET_ACCESS_KEY in deploy/.env}
      GARAGE_BUCKET: photos
      GARAGE_CAPACITY: ${GARAGE_CAPACITY:-500G}
    volumes:
      - ${PHOTOS_DIR:-garage}:/var/lib/garage   # put PHOTOS_DIR on the big volume

  # Off-site photo sync for backup.sh: `docker compose run --rm rclone ...` (only started explicitly).
  rclone:
    image: rclone/rclone:1.71
    profiles: [backup]
    environment:
      RCLONE_CONFIG_GARAGE_TYPE: s3
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
    volumes:
      - ${RCLONE_CONFIG_DIR:-~/.config/rclone}:/config/rclone   # holds the off-site remote

volumes:
  pgdata:
  garage:
  caddy-data:
  caddy-config:
